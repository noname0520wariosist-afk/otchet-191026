<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Отчет</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #3498db; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Данные отчета</h1>
        <table><thead><tr><th>Город</th><th>Температура</th><th>Погода</th><th>Ветер</th></tr></thead><tbody><tr><td>Москва</td><td>5</td><td>Облачно</td><td>3 м/с</td></tr><tr><td>Питер</td><td>3456789</td><td>Морось</td><td>5 м/с</td></tr><tr><td>Сочи</td><td>67</td><td>Солнечно</td><td>2 м/с</td></tr></tbody></table>
    </div>
</body>
</html>
